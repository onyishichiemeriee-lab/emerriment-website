[build]
publish = "."
functions = "netlify/functions"
# Writes js/runtime-config.js (browser: which Supabase project this deploy
# may use) and netlify/lib/deploy-context.json (functions: build context)
# from Netlify's CONTEXT. Production → production project; deploy previews
# and branch deploys → staging only (STAGING_PUBLIC_SUPABASE_URL /
# STAGING_PUBLIC_SUPABASE_ANON_KEY), otherwise fail-closed. See
# docs/STAGING_AND_PREVIEWS.md.
command = "node scripts/write-runtime-config.js"

[dev]
publish = "."
functions = "netlify/functions"

# 14-day email sequence: registered to run once a day at 07:00 UTC
# (08:00 Africa/Lagos, a sensible local reading time).
# (The function's own `exports.config` is not recognised by Netlify for
# this function format.) It sends NOTHING until the environment variable
# EMAIL_SEQUENCE_ENABLED=true is set — see supabase/README.md.
[functions."email-sequence"]
schedule = "0 7 * * *"

# Verified-customer onboarding (purchases table only). Sends nothing until
# CUSTOMER_ONBOARDING_ENABLED=true. Cron is UTC: 07:00 UTC = 08:00 Africa/Lagos.
[functions."customer-onboarding"]
schedule = "0 7 * * *"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://region1.google-analytics.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

# Account, dashboard and CMS pages: keep them out of search results.
# (Headers are added to the site-wide ones above.)
[[headers]]
for = "/login*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/signup*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/forgot-password*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/reset-password*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/dashboard*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/encyclopediaCMS*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/thank-you*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/admin/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

# -------------------------------------------------------------------
# Internal files must not be downloadable.
# The site is published from the repository root (publish = "."), so
# source, tests, migrations and tooling would otherwise be public.
# `force = true` makes these rules win even though the files exist.
# Netlify Functions (/.netlify/functions/*) are NOT affected.
# -------------------------------------------------------------------
[[redirects]]
from = "/netlify/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/emails/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/tests/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/supabase/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/docs/*"
to = "/404"
status = 404
force = true

# Build tooling is not part of the website.
[[redirects]]
from = "/scripts/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/local-ai/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/node_modules/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/package.json"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/package-lock.json"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/deno.lock"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/netlify.toml"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/test-emails.js"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/test-special-emails.js"
to = "/404"
status = 404
force = true

# Local backup folders (git-ignored). Present only if a deploy is made
# from this folder with the Netlify CLI; they contain outdated code.
[[redirects]]
from = "/EMerriment Authentication V2/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/EMerriment Authentication V3 — VERIFIED BACKUP/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/ROOT AUTH BACKUP BEFORE V2/*"
to = "/404"
status = 404
force = true
