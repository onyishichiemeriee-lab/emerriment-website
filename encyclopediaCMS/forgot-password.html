<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EMerriment</title>

    <link rel="stylesheet" href="css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🌿
        </div>

        <h1>Forgot Your Password?</h1>

        <p class="subtitle">
            Enter your email address below and we'll send you a password reset link so you can regain access to your EMerriment account.
        </p>

        <form id="forgotPasswordForm">

            <div class="input-group">
                <label for="resetEmail">Email Address</label>

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Send Reset Link
            </button>

        </form>

        <div id="authMessage" class="message"></div>

        <div class="auth-footer">

            <p>
                Remember your password?
                <a href="loginD.html">Login</a>
            </p>

            <p>
                Don't have an account?
                <a href="signup.html">Create One</a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
