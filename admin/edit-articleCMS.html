<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMerriment CMS - Edit Article</title>

    <link rel="stylesheet" href="css/adminCMS.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="js/edit-articleCMS.js" defer></script>
</head>

<body>

<header class="topbar">

    <div class="logo">
        🌿 <span>EMerriment CMS</span>
    </div>

    <button id="logoutBtn" class="logout-btn">
        Logout
    </button>

</header>

<div class="layout">

    <aside class="sidebar">

        <a href="dashboardCMS.html">🏠 Dashboard</a>
        <a href="articlesCMS.html" class="active">📚 Articles</a>
        <a href="usersCMS.html">👥 Users</a>
        <a href="analyticsCMS.html">📊 Analytics</a>
        <a href="productsCMS.html">🛍️ Products</a>

    </aside>

    <main class="content">

        <h1>Edit Article</h1>

        <form id="editArticleForm">

            <label>Title</label>
            <input type="text" id="title" required>

            <label>Slug</label>
            <input type="text" id="slug" required>

            <label>Category</label>
            <input type="text" id="category" required>

            <label>Featured Image URL</label>
            <input type="url" id="featured_image">

            <label>Summary</label>
            <textarea id="summary" rows="4"></textarea>

            <label>Reading Time</label>
            <input type="number" id="reading_time">

            <label>SEO Keywords</label>
            <input type="text" id="seo_keywords">

            <label>Related Conditions</label>
            <input type="text" id="related_conditions">

            <label>Content</label>
            <textarea id="content" rows="18" required></textarea>

            <div style="margin-top:20px;display:flex;gap:15px;flex-wrap:wrap;">

                <button type="submit" class="logout-btn">
                    💾 Save Changes
                </button>

                <button
                    type="button"
                    id="deleteBtn"
                    class="logout-btn"
                    style="background:#d9534f;">
                    🗑 Delete Article
                </button>

            </div>

        </form>

        <div id="message"></div>

    </main>

</div>

</body>
</html>
