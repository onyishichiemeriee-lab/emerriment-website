<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
EMerriment AI Analytics
</title>


<link rel="stylesheet" href="css/analytics.css">


</head>


<body>


<!-- =========================================
     ANALYTICS HEADER
========================================= -->


<header class="analytics-header">


    <div class="analytics-brand">


        <div class="analytics-logo">

            📊

        </div>


        <div>

            <h1>
                EMerriment AI Analytics
            </h1>

            <p>
                AI performance and user insights
            </p>

        </div>


    </div>



    <a href="ai-dashboard.html"
       class="back-dashboard">

        ← AI Dashboard

    </a>


</header>





<!-- =========================================
     MAIN CONTAINER
========================================= -->


<main class="analytics-container">





<!-- =========================================
     METRIC CARDS
========================================= -->


<section class="analytics-grid">



<div class="analytics-card">


    <div class="metric-icon">
        👥
    </div>


    <div>

        <h2 id="aiUsers">
            0
        </h2>


        <p>
            AI Users
        </p>

    </div>


</div>





<div class="analytics-card">


    <div class="metric-icon">
        💬
    </div>


    <div>

        <h2 id="totalChats">
            0
        </h2>


        <p>
            Total Chats
        </p>

    </div>


</div>






<div class="analytics-card">


    <div class="metric-icon">
        📝
    </div>


    <div>

        <h2 id="totalMessages">
            0
        </h2>


        <p>
            Total Messages
        </p>

    </div>


</div>






<div class="analytics-card">


    <div class="metric-icon">
        ⭐
    </div>


    <div>

        <h2 id="aiRating">
            0
        </h2>


        <p>
            AI Satisfaction
        </p>

    </div>


</div>



</section>






<!-- =========================================
     USER GROWTH CHART
========================================= -->


<section class="chart-container">


    <div class="section-header">

        <h2>
            User Growth
        </h2>


        <p>
            AI adoption over time
        </p>


    </div>



    <canvas id="userGrowthChart"></canvas>



</section>







<!-- =========================================
     TOPIC ANALYTICS
========================================= -->


<section class="analytics-panel">


<h2>
    🌿 Popular Skincare Topics
</h2>



<div id="topicAnalytics">


<!-- Generated by analytics.js -->


</div>



</section>







<!-- =========================================
     PRODUCT ANALYTICS
========================================= -->


<section class="analytics-panel">


<h2>
    🛍 Product Recommendation Performance
</h2>



<div id="productAnalytics">


<!-- Generated by analytics.js -->


</div>



</section>







<!-- =========================================
     AI PERFORMANCE
========================================= -->


<section class="analytics-panel">


<h2>
    🤖 AI Performance Report
</h2>



<div id="aiPerformance">


<!-- Generated by analytics.js -->


</div>



</section>




</main>

<!-- Analytics Logic -->
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="../../js/supabase.js"></script>

<script src="js/analytics.js"></script>

</body>

</html>
