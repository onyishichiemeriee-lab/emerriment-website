<h1>Add Product</h1>

<form id="productForm">

<label>Product Name</label>

<input
type="text"
id="name"
required>

<label>Description</label>

<textarea
id="description"
rows="6"
required></textarea>

<label>Price (₦)</label>

<input
type="number"
id="price"
required>

<label>Selar Link</label>

<input
type="url"
id="selarLink"
required>

<label>Category</label>

<select id="category">

<option>Course</option>

<option>Bundle</option>

<option>Challenge</option>

<option>Guide</option>

</select>

<label>Product Image URL</label>

<input
type="url"
id="image">

<label>

<input
type="checkbox"
id="featured">

Featured Product

</label>

<label>

<input
type="checkbox"
id="recommended">

Recommended By Skin Quiz

</label>

<button type="submit">

Save Product

</button>
