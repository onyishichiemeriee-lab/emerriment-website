<!-- =========================================
     EMerriment AI Conversation History
     Header
========================================= -->

<header class="history-header">

    <div class="header-left">

        <a href="index.html" class="back-button">

            ← Back to AI

        </a>


        <div class="brand-area">

            <div class="ai-logo">

                🤖

            </div>


            <div>

                <h1>
                    EMerriment AI
                </h1>


                <p>
                    Conversation History
                </p>

            </div>

        </div>


    </div>



    <button 
        class="new-chat-btn"
        id="newChatButton"
    >

        ＋ New Chat

    </button>


</header>

<!-- =========================================
     Conversation Search
========================================= -->

<section class="history-search">

    <div class="search-wrapper">

        <span class="search-icon">
            🔍
        </span>


        <input 
            type="search"
            id="conversationSearch"
            placeholder="Search conversations..."
        >

    </div>

</section>

<!-- =========================================
     Conversation List
========================================= -->

<section class="conversation-section">


    <div class="section-title">

        <h2>
            Your Conversations
        </h2>


        <span id="conversationCount">

            0 chats

        </span>

    </div>



    <div 
        id="conversationList"
        class="conversation-list"
    >

        <!-- Conversation cards
             will be generated by history.js -->

    </div>


</section>

<!-- =========================================
     Empty State
========================================= -->

<div 
    id="emptyState"
    class="empty-state hidden"
>


    <div class="empty-icon">

        💬

    </div>


    <h3>
        No conversations yet
    </h3>


    <p>

        Start chatting with EMerriment AI
        and your skincare journey will appear here.

    </p>


    <a 
        href="index.html"
        class="start-chat-btn"
    >

        Start Your First Chat

    </a>


</div>

<!-- =========================================
     Loading State
========================================= -->

<div 
    id="loadingState"
    class="loading-state"
>


    <div class="loader"></div>


    <p>
        Loading your conversations...
    </p>


</div>

<!-- =========================================
     Conversation Menu
========================================= -->

<div 
    id="conversationMenu"
    class="conversation-menu hidden"
>


    <button id="renameConversation">

        ✏️ Rename

    </button>



    <button id="pinConversation">

        ⭐ Pin

    </button>



    <button id="archiveConversation">

        📦 Archive

    </button>



    <button 
        id="deleteConversation"
        class="danger-action"
    >

        🗑️ Delete

    </button>


</div>

<script src="../js/supabase.js"></script>

<script src="js/ai-database.js"></script>

<script src="js/history.js"></script>
