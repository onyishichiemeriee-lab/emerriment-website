<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View your EMerriment AI skincare conversation history."
    >

    <title>Conversation History | EMerriment AI</title>


    <!-- =========================================
         FAVICON
    ========================================== -->

    <link
        rel="icon"
        type="image/png"
        href="../images/favicon.png"
    >


    <!-- =========================================
         HISTORY STYLES
    ========================================== -->

    <link
        rel="stylesheet"
        href="./ai/css/history.css"
    >

</head>


<body>


    <!-- =========================================
         EMERRIMENT AI HISTORY HEADER
    ========================================== -->

    <header class="history-header">

        <div class="header-left">


            <!-- Back to AI -->

            <a
                href="index.html"
                class="back-button"
            >

                ← Back to AI

            </a>


            <!-- Brand -->

            <div class="brand-area">

                <div class="ai-logo">

                    🤖

                </div>


                <div>

                    <h1>
                        EMerriment AI
                    </h1>


                    <p>
                        Conversation History
                    </p>

                </div>

            </div>

        </div>


        <!-- New Chat -->

        <button
            type="button"
            class="new-chat-btn"
            id="newChatButton"
        >

            ＋ New Chat

        </button>

    </header>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="history-main">


        <!-- =====================================
             SEARCH
        ====================================== -->

        <section class="history-search">

            <div class="search-wrapper">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >

                    🔍

                </span>


                <input
                    type="search"
                    id="conversationSearch"
                    placeholder="Search conversations..."
                    autocomplete="off"
                    aria-label="Search conversations"
                >

            </div>

        </section>



        <!-- =====================================
             CONVERSATIONS
        ====================================== -->

        <section class="conversation-section">


            <div class="section-title">

                <div>

                    <h2>
                        Your Conversations
                    </h2>

                </div>


                <span id="conversationCount">

                    0 chats

                </span>

            </div>


            <!-- Conversation list -->

            <div
                id="conversationList"
                class="conversation-list"
            >

                <!--
                    Conversations are loaded
                    dynamically by history.js.
                -->

            </div>

        </section>



        <!-- =====================================
             EMPTY STATE
        ====================================== -->

        <section
            id="emptyState"
            class="empty-state hidden"
        >


            <div class="empty-icon">

                💬

            </div>


            <h3>
                No conversations yet
            </h3>


            <p>

                Start chatting with EMerriment AI
                and your skincare journey will
                appear here.

            </p>


            <a
                href="index.html"
                class="start-chat-btn"
            >

                Start Your First Chat

            </a>

        </section>



        <!-- =====================================
             LOADING STATE
        ====================================== -->

        <section
            id="loadingState"
            class="loading-state"
            aria-live="polite"
        >


            <div
                class="loader"
                aria-hidden="true"
            ></div>


            <p>
                Loading your conversations...
            </p>

        </section>

    </main>



    <!-- =========================================
         CONVERSATION ACTION MENU
    ========================================== -->

    <div
        id="conversationMenu"
        class="conversation-menu hidden"
        role="menu"
    >


        <button
            type="button"
            id="renameConversation"
            role="menuitem"
        >

            ✏️ Rename

        </button>



        <button
            type="button"
            id="pinConversation"
            role="menuitem"
        >

            ⭐ Pin

        </button>



        <button
            type="button"
            id="archiveConversation"
            role="menuitem"
        >

            📦 Archive

        </button>



        <button
            type="button"
            id="deleteConversation"
            class="danger-action"
            role="menuitem"
        >

            🗑️ Delete

        </button>

    </div>



    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!--
        IMPORTANT:

        history.html is inside /ai/

        Therefore ../js/ points to the
        main website JavaScript folder.
    -->

    <script src="../js/supabase.js"></script>



    <!-- =========================================
         AI DATABASE
    ========================================== -->

    <script src="js/ai-database.js"></script>



    <!-- =========================================
         HISTORY CONTROLLER
    ========================================== -->

    <script src="js/history.js"></script>


</body>

</html>
